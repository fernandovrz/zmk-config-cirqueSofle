CONFIG_INPUT_PINNACLE=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Pantalla OLED (SSD1306 128x32, solo en esta mitad).
#
# NO anadir CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED: comprobado por
# aislamiento que con esa opcion esta mitad deja de emparejarse con la
# central y el panel se queda con el ruido de encendido.
CONFIG_ZMK_DISPLAY=y
