CONFIG_INPUT_PINNACLE=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Pantalla OLED (SSD1306 128x32, solo en esta mitad).
#
# Intento con las opciones BLE de soflecirque.conf. Referencia:
# mctechnology17/zmk-config tiene un Sofle con este MISMO nodo ssd1306
# (identico linea por linea, inversion-on incluido) y la pantalla le
# funciona sobre ZMK v0.3.0. La unica diferencia estaba en el .conf.
#
# El informe de memoria del build descarta agotamiento de RAM: 27% usada,
# 46% de flash. Pero un desbordamiento de PILA no necesita la RAM llena.
# Defaults de ZMK v0.3 verificados en app/src/display/Kconfig:
#   ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE = 2048
#   SYSTEM_WORKQUEUE_STACK_SIZE             = 1024  (sin hilo dedicado)
# Las dos variantes que fallaron renderizaban LVGL sobre pilas de 1-2 KB.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=8192

# ============================================================
# TEMPORAL - FIRMWARE DE DIAGNOSTICO. Revertir despues.
# ============================================================
# ZMK apaga USB en el periferico (ZMK_USB depende de
# ZMK_SPLIT_ROLE_CENTRAL), asi que no hay forma de leer el log de esta
# mitad. Se le fuerza el rol de central SOLO para poder instrumentarla:
# con USB disponible, ZMK_USB_LOGGING expone el arranque por puerto serie.
#
# ZMK_USB_LOGGING NO va aqui: ponerlo a mano enciende el log pero no crea
# el puerto serie, y la compilacion aborta por DT_HAS_ZEPHYR_CDC_ACM_UART.
# Lo aporta el snippet zmk-usb-logging, activado desde build.yaml.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_KEYBOARD_NAME="SofleDEBUG"
