CONFIG_INPUT_PINNACLE=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Pantalla OLED - DESACTIVADA. No activar sin leer esto.
#
# Con CONFIG_ZMK_DISPLAY=y esta mitad NO se empareja con la central, y el
# panel se queda con el ruido de encendido (nunca recibe un frame).
# Comprobado en cinco firmwares; el display correlaciona 4 de 4:
#
#   trackpad fantasma | display          | conecta
#   ------------------|------------------|--------
#   presente          | OFF              | si
#   presente          | ON + workqueue   | NO
#   quitado           | ON + workqueue   | NO
#   quitado           | OFF              | si
#   presente          | ON (sin wq)      | NO
#
# No es el hilo dedicado ni el bus I2C: los dos se descartaron por separado.
# Causa exacta sin determinar; la sospecha viva es agotamiento de RAM en el
# periferico (LVGL + buffers del display dejando sin memoria a la pila BLE).
# Para confirmarlo hace falta leer el log del dispositivo, y ZMK desactiva
# USB en el periferico (ZMK_USB depende de ZMK_SPLIT_ROLE_CENTRAL), asi que
# haria falta un depurador por SWD/RTT.
#
# CONFIG_ZMK_DISPLAY=y
