# Sin CONFIG_INPUT_PINNACLE: esta mitad no lleva trackpad, y compilar el
# driver solo servia para machacar el bus I2C que comparte con el OLED.

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Pantalla OLED (SSD1306 128x32, solo en esta mitad).
#
# NO volver a anadir CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED aqui.
# Comprobado por aislamiento: con esa opcion esta mitad dejaba de emparejarse
# con la central y el panel se quedaba con el ruido de encendido. Encaja con
# un desbordamiento de pila del hilo dedicado: el driver alcanza a encender
# el panel y acto seguido el sistema se cae, asi que ni pinta un frame ni
# levanta el Bluetooth. Sin esa linea la mitad conecta con normalidad.
CONFIG_ZMK_DISPLAY=y
