# Sin CONFIG_INPUT_PINNACLE: esta mitad no lleva trackpad, y compilar el
# driver solo servia para machacar el bus I2C que comparte con el OLED.

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Pantalla OLED - DESACTIVADA A PROPOSITO (experimento de aislamiento).
#
# La pantalla es lo unico funcional que anadimos a esta mitad, y desde que
# se anadio la mitad no se conecta con la central. Con estas dos lineas
# comentadas la izquierda vuelve a su configuracion original de fabrica.
#   - Si AHORA se conectan: el culpable es CONFIG_ZMK_DISPLAY.
#   - Si SIGUE sin conectar: el fallo no lo introdujimos nosotros.
#
# CONFIG_ZMK_DISPLAY=y
# CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
