CONFIG_INPUT_PINNACLE=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Pantalla OLED (SSD1306 128x32, solo en esta mitad).
#
# Estado: la mitad NO arranca como periferica con el display activado.
# La correlacion observada es el ROL, no la pila:
#
#   rol         display  pila   resultado
#   ----------  -------  -----  --------------------------
#   periferica  si       1024   ruido, no conecta
#   periferica  si       2048   ruido, no conecta
#   central     si       8192   arranca, USB OK
#   periferica  si       8192   ruido, no conecta
#
# La pila se deja en 8192 por prudencia (los defaults de 1024/2048 son
# escasos para LVGL), pero NO esta demostrado que fuera la causa: el
# firmware que arranco cambiaba pila Y rol a la vez.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=8192

# Lo unico que ZMK monta distinto en el display segun el rol es el juego de
# widgets, y solo hay uno exclusivo del periferico:
#   ZMK_WIDGET_PERIPHERAL_STATUS  depends on BT && ZMK_SPLIT_BLE
#                                 && !ZMK_SPLIT_ROLE_CENTRAL
# Se desactiva para aislarlo: queda solo el widget de bateria.
CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=n
