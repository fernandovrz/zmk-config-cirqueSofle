# ===========================================================================
# PANTALLA OLED - DESACTIVADA. Sin resolver. Leer antes de reactivar.
# ===========================================================================
# Con CONFIG_ZMK_DISPLAY=y esta mitad NO se empareja con la central y el
# panel se queda con el ruido de encendido (nunca recibe un frame).
#
# Lo que correlaciona es el ROL, no la pila ni los widgets:
#
#   rol         display  pila   widget periph.  resultado
#   ----------  -------  -----  --------------  ---------------------
#   periferica  no       -      -               OK
#   periferica  si       1024   si              ruido, no conecta
#   periferica  si       2048   si              ruido, no conecta
#   central     si       8192   n/a             arranca, USB OK
#   periferica  si       8192   si              ruido, no conecta
#   periferica  si       8192   NO              ruido, no conecta
#
# DESCARTADO con evidencia, no por intuicion:
#  - Geometria del panel: la zona iluminada mide 4:1 -> es 128x32, correcto
#  - Devicetree del display: mctechnology17/zmk-config tiene un Sofle con
#    este nodo ssd1306 IDENTICO linea por linea y le funciona en ZMK v0.3.0
#  - Bus I2C: quitado el trackpad fantasma de esta mitad, sin cambio
#  - Agotamiento de RAM: el informe del build da 27% RAM y 46% flash
#  - Pila del hilo de renderizado: probado 1024, 2048 y 8192
#  - Juego de widgets: probado sin ZMK_WIDGET_PERIPHERAL_STATUS
#  - Emparejamiento: probado con settings_reset en ambas mitades
#  - Opciones BLE de la config de referencia (EXPERIMENTAL_CONN y compania)
#
# No se puede leer el log del dispositivo: ZMK apaga USB en el periferico
# (ZMK_USB depende de ZMK_SPLIT_ROLE_CENTRAL). Forzando el rol central si
# arranca y enumera USB, lo que confirma que el fallo es del rol periferico,
# pero esa configuracion no sirve para usar el teclado.
#
# Siguiente paso real: preguntar en la comunidad ZMK con esta tabla, o
# depurar por SWD/RTT.
#
# CONFIG_ZMK_DISPLAY=y
# CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
# CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=8192
