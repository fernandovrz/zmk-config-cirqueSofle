CONFIG_INPUT_PINNACLE=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Pantalla OLED (SSD1306 128x32, solo en esta mitad).
#
# La pila del hilo de renderizado es CRITICA. NO bajar este valor.
# Con los defaults de ZMK v0.3 esta mitad se caia al arrancar:
#   ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE = 2048
#   SYSTEM_WORKQUEUE_STACK_SIZE             = 1024  (sin hilo dedicado)
# El driver encendia el panel y LVGL reventaba la pila acto seguido: el
# sistema moria antes de USB, de Bluetooth y del primer frame. Sintomas:
# pantalla con ruido de encendido y la mitad sin emparejarse con la central.
# Verificado que con 8192 arranca y se mantiene estable.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=8192
