CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Uncomment these two lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Estabilidad BLE. Tomadas de mctechnology17/zmk-config, un Sofle con OLED
# funcionando sobre ZMK v0.3.0 (nuestra misma version).
#
# EXPERIMENTAL_CONN ajusta los tiempos de inicio del emparejamiento BLE,
# restaura la implementacion nueva de LLCP y desactiva 2M PHY. Es justo el
# area donde falla nuestro periferico al activar la pantalla.
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
